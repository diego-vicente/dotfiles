# tmux — dvicente-claw (Debian, headless)
#
# Deployed to ~/.config/tmux/tmux.conf on the SERVER. This is a cropped sibling
# of tmux.conf, not a copy: everything macOS- or Ghostty-specific is removed,
# because none of it exists on a headless Debian box.
#
# Removed on purpose:
#   - pbcopy in copy-mode        -> no macOS; OSC 52 sends to the client instead
#   - xterm-ghostty overrides    -> ssh_config sets TERM=xterm-256color for this
#                                   hop, so the ghostty entry would never match
#   - tpm and all plugins        -> keep an agent box dependency-free
#   - work/personal bindings     -> those workspaces are a laptop concept

# ---------------------------------------------------------------------------
# Prefix — C-a, deliberately DIFFERENT from the laptop's C-\ / C-b.
#
# You will often reach this box by SSHing from inside the laptop's tmux. The
# outer server swallows its own prefix bytes, so a shared prefix would never
# arrive here. C-a is distinct, and it is two taps on the rootshell toolbar
# (Ctrl, then a) when connecting straight from the phone.
#
# Cost: C-a stops being beginning-of-line in the shell here. On a box that
# mostly runs agents, that is a fair trade.
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",*256col*:Tc"
set  -ga terminal-features ",*:usstyle"
set  -ga terminal-features ",*:sync"    # DEC 2026 — stops Claude Code flicker

# Login shell stays bash so SSH-based automation (the handover skill, the
# paseo/omnara daemons, any `ssh claw '<bash syntax>'` caller) keeps working.
# fish is what you actually type in, because every pane starts one.
set  -g  default-shell /usr/bin/fish

set  -sg escape-time 10
set  -g  focus-events on
set  -g  history-limit 100000
set  -g  set-clipboard on   # OSC 52: copies land in the CLIENT's clipboard,
                            # which is the only thing that makes sense headless

# ---------------------------------------------------------------------------
# Coding agents — this box exists to run them
# ---------------------------------------------------------------------------
set  -g  allow-passthrough on
set  -s  extended-keys on
set  -as terminal-features 'xterm*:extkeys'
bind o send-keys C-o

set  -g  monitor-bell on
set  -g  bell-action any

# ---------------------------------------------------------------------------
# Survival — sessions here must outlive every disconnect, that is the point
# ---------------------------------------------------------------------------
set -g exit-empty off
set -g destroy-unattached off
set -g detach-on-destroy on

# ---------------------------------------------------------------------------
# Mouse, indexing, titles
# ---------------------------------------------------------------------------
set  -g  mouse on
set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  renumber-windows on
setw -g  aggressive-resize on

set  -g  set-titles on
set  -g  set-titles-string "claw · #{session_name} · #W"

# ---------------------------------------------------------------------------
# Panes
# ---------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind z resize-pane -Z
bind x kill-pane
bind Space next-layout

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -r n next-window
bind -r p previous-window
bind Tab last-window

# ---------------------------------------------------------------------------
# Sessions
# ---------------------------------------------------------------------------
bind C-a switch-client -l
bind s choose-tree -Zs

# ---------------------------------------------------------------------------
# Copy mode — no pbcopy here. copy-selection-and-cancel plus set-clipboard on
# pushes the selection over OSC 52 to whatever is attached, Ghostty or
# rootshell, which is exactly what you want from a headless box.
# ---------------------------------------------------------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi q send -X cancel

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ---------------------------------------------------------------------------
# Status bar — visually distinct from the laptop ON PURPOSE. When you are
# nested two tmuxes deep it must be obvious which one you are typing at.
# ---------------------------------------------------------------------------
set -g status-position top
set -g status-style "bg=colour52,fg=colour223"
set -g status-left  " #[bold]claw#[nobold]:#S  "
set -g status-left-length 30
set -g status-right "#{?client_prefix,PREFIX ,}%H:%M "
set -g window-status-current-style "fg=colour255,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour130"
