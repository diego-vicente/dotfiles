# Status bar — one row, degrading by width.
#
# Sourced from tmux.conf. Kept separate because it is the noisiest part of the
# config and the part most likely to churn.
#
# WHY TIERS: measured, not guessed. Four sessions + three windows + a full
# modeline needs 130 columns. On the 13" at 80 columns that overflows by 50,
# and tmux resolves an overflow by silently truncating the MIDDLE — the window
# list — because status-left-length and status-right-length reserve the ends.
# So the bar chooses what to drop instead of letting tmux drop it for us.
#
#   >=160  sessions · windows · path · 5h · cost · clock
#   120-159  sessions · windows · 5h · clock
#    80-119  sessions · 5h · clock
#    <80     current session only · 5h        (the phone)
#
# COLOURS: ANSI 0-15 and `default` only, so the bar follows the terminal
# between catppuccin latte and mocha. See the note in tmux.conf.

# ---------------------------------------------------------------------------
# Agent state, published by ~/.claude/bin/tmux-agent-state.sh
#
# Ordered by how much each state is blocking YOU. `asking` means Claude is
# waiting on a permission decision or a question, so it outranks a finished
# turn; `done` outranks something still running.
# ---------------------------------------------------------------------------
# Just the glyph, coloured by state. The brackets around it are emitted by the
# caller in the SELECTED colour, so a marked entry reads "[?] garden" with only
# the "?" standing out.
# The glyph CHARACTERS come from bin/theme-sync.sh as octal escapes; only the
# colouring lives here. Colours stay ANSI so they keep tracking the terminal.
#
# The character and the colour are separate options on purpose. A glyph cannot
# keep its semantic colour on the teal chip, because the latte accents are tuned
# for text on base and every one of them collapses against teal:
#
#                   on the pill    on the teal chip
#   colour3 yellow      1.70             1.43
#   colour1 red         3.52             1.45
#   colour2 green       2.17             1.12
#   colour4 blue        3.18             1.31
#   canvas                 —             3.31
#
# The state still reads from the SHAPE, which is why the icons are distinct
# outlines rather than four coloured dots. So the chip drops the hue and paints
# the glyph in its own text colour, and every other surface keeps the hue.
set -g @glyph_blocked_fg  "colour3"
set -g @glyph_error_fg    "colour1"
set -g @glyph_finished_fg "colour2"
set -g @glyph_working_fg  "colour4"

# The quiet state takes the theme's plain TEXT colour rather than an accent,
# which is the point of it: a chat is open and wants nothing. Not `fg=default`,
# because push-default redefines what `default` means inside a pill and the
# asterisk would come out in the pill's dim shade.
set -g @glyph_idle_fg     "#{E:@bar_text}"

# Character and semantic colour for the SESSION's rolled-up state. `idle` is the
# fallback arm rather than a tested one, so an unrecognised value shows as the
# quiet asterisk instead of a spinner that never stops.
set -g @agent_ch "\
#{?#{==:#{@agent},blocked},#{E:@glyph_blocked_ch},\
#{?#{==:#{@agent},error},#{E:@glyph_error_ch},\
#{?#{==:#{@agent},finished},#{E:@glyph_finished_ch},\
#{?#{==:#{@agent},working},#{E:@glyph_working_ch},#{E:@glyph_idle_ch}}}}}"

set -g @agent_fg "\
#{?#{==:#{@agent},blocked},#{E:@glyph_blocked_fg},\
#{?#{==:#{@agent},error},#{E:@glyph_error_fg},\
#{?#{==:#{@agent},finished},#{E:@glyph_finished_fg},\
#{?#{==:#{@agent},working},#{E:@glyph_working_fg},#{E:@glyph_idle_fg}}}}}"

# Same pair for the WINDOW's aggregate. @agent_win, never @agent: a session
# option inherits into every window and would mark them all.
set -g @agent_win_ch "\
#{?#{==:#{@agent_win},blocked},#{E:@glyph_blocked_ch},\
#{?#{==:#{@agent_win},error},#{E:@glyph_error_ch},\
#{?#{==:#{@agent_win},finished},#{E:@glyph_finished_ch},\
#{?#{==:#{@agent_win},working},#{E:@glyph_working_ch},#{E:@glyph_idle_ch}}}}}"

set -g @agent_win_fg "\
#{?#{==:#{@agent_win},blocked},#{E:@glyph_blocked_fg},\
#{?#{==:#{@agent_win},error},#{E:@glyph_error_fg},\
#{?#{==:#{@agent_win},finished},#{E:@glyph_finished_fg},\
#{?#{==:#{@agent_win},working},#{E:@glyph_working_fg},#{E:@glyph_idle_fg}}}}}"

# Sessions: the selected one is a TEAL CHIP with slanted edges, not coloured
# text. Teal cannot carry an accent as text in latte — 2.43 on the pill, 3.31
# even on the bare canvas — because the latte accents are tuned for text on
# base rather than on a surface. As a fill the same teal reads 3.31 with canvas
# text on it, and 11.01 in mocha, and the filled shape does the work the hue
# could not.
set -g @style_sel   "#[fg=#{E:@bar_canvas},bg=#{E:@bar_teal},bold]"
# nobold is load-bearing: tmux styles are CUMULATIVE, so re-emitting only a
# colour after a bold glyph leaves the bold on and the rest of an unselected
# entry rendered bold.
#
# @bar_dim, not colour8: once the bar has a filled background, colour8 IS a
# surface shade in mocha and lands 1.88 against it. Published per flavour by
# bin/theme-sync.sh; see the header there for why the ANSI-only rule had to bend
# exactly this far and no further.
set -g @style_unsel "#[fg=#{E:@bar_dim},bg=#{E:@pill_bg},nobold]"

# --- separators ------------------------------------------------------------
# Every session carries a leading "/" divider. The divider FILLS when that
# session is selected: the thin U+E0BB becomes the solid U+E0BC, which is the
# same diagonal, and the chip's teal starts along it.
#
# Powerline colouring rule: fg is the colour of the segment on the LEFT, bg the
# colour on the RIGHT. So entering the chip is pill-on-teal and leaving it is
# teal-on-pill, both drawn with the same glyph.
#
# A selected entry also emits a TRAILING space after its closing edge. Without
# it the closing solid butts straight against the next entry's thin divider and
# the two glyphs read as one thick smudge. tmux formats cannot see the previous
# iteration of #{S:}, so the boundary between a chip and the entry after it
# cannot be a single shared separator — the space is what keeps the doubling
# legible instead of accidental.
# A CELL HOLDS TWO COLOURS, so the chip edge cannot show pill, canvas and teal
# at once. Painting the edge in the canvas colour therefore did not add a slit —
# it displaced the pill, and the chip's two-colour transition collapsed into a
# bright notch that read exactly like the thin divider next to it.
#
# The edges keep the two-colour transition. What changes is WHICH HALF IS INK,
# because only the ink overshoots the cell. Measured against a 1000-unit em:
#
#   cell box                       -300 .. 1020   height 1320   advance 600
#   ple-forwardslash_separator     -300 .. 1020   1320    599   exact
#   ple-upper_left_triangle        -307 .. 1027   1334    629   overshoots
#   ple-lower_right_triangle       -307 .. 1027   1334    629   overshoots
#
# Nerd-fonts draws the thick glyphs seven units past the cell so two abutting
# segments never show a hairline seam. That overshoot rounds up to a whole pixel
# of ink above and below the pill. @sep_out used to be teal ink and produced a
# teal spike; @sep_in used pill ink and produced a fringe nobody noticed.
#
# ple-upper_left_triangle and ple-lower_right_triangle are the two halves of one
# "/" diagonal, so they draw the same picture with the colours swapped. Using
# the lower-right variant for @sep_out puts the PILL in the ink and the teal in
# the background, which is the identical shape with an invisible fringe: pill
# grey against the canvas is 1.37, teal against it is 3.31.
set -g @sep_unsel "#[fg=#{E:@bar_canvas},bg=#{E:@pill_bg},nobold]#{E:@sep_thin}"
set -g @sep_in    "#[fg=#{E:@pill_bg},bg=#{E:@bar_teal},nobold]#{E:@sep_solid_ul}"
set -g @sep_out   "#[fg=#{E:@pill_bg},bg=#{E:@bar_teal},nobold]#{E:@sep_solid_lr}"

# Windows: selected is the theme's own TEXT colour, so it gains contrast in both
# flavours — darker than the dim shade on latte, lighter on mocha. colour7 could
# not do this: it is lighter than colour8 in latte AND mocha, so it only stands
# out on a dark background.
#
# This used to be `fg=default` and had to stop being that. The pills wrap their
# contents in #[push-default] so the entries' own #[default] resets land back on
# the pill surface instead of punching canvas-coloured holes in it — but
# push-default redefines what `default` MEANS, so `fg=default` here would have
# resolved to the pill's dim foreground and rendered selected and unselected
# windows identically, separated only by bold. Naming the colour avoids
# depending on what `default` currently points at.
set -g @style_win_sel "#[fg=#{E:@bar_text},bold]"

# --- session entry ---------------------------------------------------------
# Selected is "the session THIS CLIENT is viewing", compared against
# #{client_session} — NOT #{session_attached}, which is a COUNT of clients and
# is therefore non-zero for every session that any window has open. With a
# Ghostty window per context, that painted two sessions blue at once.
# The style is re-emitted after the glyph so the closing bracket and the name
# return to the entry's own colour rather than the glyph's.
# On the chip the glyph takes the chip's text colour; everywhere else it keeps
# its semantic hue.
set -g @sess_mark_fg "\
#{?#{==:#{session_name},#{client_session}},#{E:@bar_canvas},#{E:@agent_fg}}"

# The styled glyph goes in its own option because #[fg=X,bold] contains a comma,
# and a comma inside a #{?...} arm ends that arm. Referenced as a single
# #{E:...} unit the comma is invisible to the conditional's parser.
set -g @sess_glyph "#[fg=#{E:@sess_mark_fg},bold]#{E:@agent_ch}"

# The marker, then the entry style again so the name is not left in the glyph's
# colour. The brackets are gone: the glyphs are icons now, and an icon does not
# need punctuation around it to read as a marker.
set -g @sess_mark "\
#{?#{@agent},#{E:@sess_glyph}\
#{?#{==:#{session_name},#{client_session}},#{E:@style_sel},#{E:@style_unsel}} ,}"

# EVERY BOUNDARY CARRIES EXACTLY ONE SEPARATOR, and each entry draws only the
# one on its left. The four cases, in order:
#
#   no previous session     nothing — there is nothing to its left
#   previous IS the chip    @sep_out, the chip's closing edge
#   this one IS the chip    @sep_in, the chip's opening edge
#   anything else           @sep_unsel, the thin divider
#
# @sess_prev comes from bin/session-seps.sh, because #{S:} cannot see its own
# previous iteration. The COMPARISON against #{client_session} happens here, not
# there, and that placement is the whole point: a neighbour is a fact about the
# session list, while the selection is a fact about one client. Publishing "the
# session after the selected one" instead mixed the two, and two ghostty windows
# on the same context then overwrote each other's answer.
set -g @sess_lead "\
#{?#{E:@sess_prev},\
#{?#{==:#{E:@sess_prev},#{client_session}},#{E:@sep_out},\
#{?#{==:#{session_name},#{client_session}},#{E:@sep_in},#{E:@sep_unsel}}},}"

set -g @sess_entry "\
#{E:@sess_lead}\
#{?#{==:#{session_name},#{client_session}},#{E:@style_sel},#{E:@style_unsel}} \
#{E:@sess_mark}"

# A trailing space always. The closing solid appears here ONLY when the chip is
# last in the list, since no entry follows to draw it.
set -g @sess_tail " \
#{?#{==:#{session_name},#{client_session}},#{?#{E:@sess_next},,#{E:@sep_out}},}"

set -g @sess_filtered "\
#{S:#{?#{m:#{s|/.*||:#{client_session}}/*,#{session_name}},\
#[range=session|#{session_id}]#{E:@sess_entry}#{s|^[^/]*/||:#{session_name}}#{E:@sess_tail}#[norange],}}"

set -g @sess_all "\
#{S:#[range=session|#{session_id}]#{E:@sess_entry}#{session_name}#{E:@sess_tail}#[norange]}"

set -g @comp_sessions "#{?#{E:@sess_filtered},#{E:@sess_filtered},#{E:@sess_all}}"

# A bare marker for surfaces with no chip and no pill: the narrowest tier and
# the session tree. Both referenced @agent_mark while nothing defined it, so
# #{E:} expanded to nothing and the phone showed no marker at all — the same
# silent failure that once ate @pane_extra.
#
# It emits its own colour and a trailing space, so the CALLER must set the name
# style AFTER it. Setting the style first lets the glyph's colour leak into the
# name.
# The styled glyph is its own option. #[fg=X,bold] contains a comma, and a comma
# inside a #{?...} arm ends that arm — this printed a bare "#[fg=colour2" with
# the bracket left open, which then swallowed the styling of whatever followed.
set -g @agent_glyph_plain "#[fg=#{E:@agent_fg},bold]#{E:@agent_ch}"
set -g @agent_mark "#{?#{@agent},#{E:@agent_glyph_plain} ,}"

# Only the attached session's name, for the narrowest tier.
set -g @comp_session_one "\
#{E:@agent_mark}#[fg=colour4,bold]#S#[default]"

# Extra panes beyond the first, as a trailing "(+1)". Nothing for a single-pane
# window, which is most of them.
set -g @pane_extra "#{?#{e|>:#{window_panes},1}, (+#{e|-|:#{window_panes},1}),}"

# --- window entry ----------------------------------------------------------
# Same rules as sessions: selected is blue+bold (was near-white), unselected is
# dim, and an agent marker reads "[?] tmux configuration (+1)" with only the
# glyph coloured. @agent_win is the per-window aggregate — NOT @agent, which is
# the session's and would inherit into every window.
# A selected WINDOW is not a chip — it sits on the pill, where the semantic
# colours still work — so the window glyph keeps its hue whether or not the
# window is active.
set -g @win_glyph "#[fg=#{E:@agent_win_fg},bold]#{E:@agent_win_ch}"

set -g @win_mark "\
#{?#{@agent_win},#{E:@win_glyph}\
#{?#{==:#{window_active},1},#{E:@style_win_sel},#{E:@style_unsel}} ,}"

set -g @win_entry "\
#{?#{==:#{window_active},1},#{E:@style_win_sel},#{E:@style_unsel}}\
#{E:@win_mark}"

# Window list, and ONLY when there is more than one window to choose between.
# The index is not shown — names are meaningful now. alt+N still selects by it.
set -g @comp_windows "\
#{?#{e|>:#{session_windows},1},\
#{W:#[range=window|#{window_index}]#{E:@win_entry}#{window_name}#{E:@pane_extra}#[default]#[norange]  },}"

# ---------------------------------------------------------------------------
# Collapsing
#
# @collapse is a SESSION option with three values: unset for both expanded,
# `sessions`, or `windows`. Three values rather than two flags, so "both
# collapsed" cannot be represented at all.
#
# SESSION-SCOPED, NOT GLOBAL AND NOT A FILE. A file would need a #() to read,
# which reintroduces the status-interval lag the modeline still suffers. And the
# choice belongs to the session rather than the client: two clients viewing
# personal/garden see the same bar and should agree, while the work window and
# the personal window stay independent because they are different sessions.
#
# The pin therefore does not follow you. Switching to another session reads that
# session's own value, which is normally unset, so the collapse is spent on the
# click that used it. Returning to the first session restores its choice.
#
# COUNTING WITHOUT A SHELL. tmux has no accumulator, but #{S:} can emit one
# character per matching session and #{n:} measures the result. So a count is
# `#{n:#{S:#{?<test>,x,}}}`, evaluated on every redraw with no fork.
# ---------------------------------------------------------------------------
# Hidden means "in this context, and not the one already on screen".
set -g @is_hidden_sess "\
#{&&:#{m:#{s|/.*||:#{client_session}}/*,#{session_name}},\
#{!=:#{session_name},#{client_session}}}"

set -g @is_hidden_win "#{!=:#{window_active},1}"

set -g @n_hidden_sess   "#{n:#{S:#{?#{E:@is_hidden_sess},x,}}}"
set -g @n_blocked_sess  "#{n:#{S:#{?#{&&:#{E:@is_hidden_sess},#{==:#{@agent},blocked}},x,}}}"
set -g @n_error_sess    "#{n:#{S:#{?#{&&:#{E:@is_hidden_sess},#{==:#{@agent},error}},x,}}}"
set -g @n_finished_sess "#{n:#{S:#{?#{&&:#{E:@is_hidden_sess},#{==:#{@agent},finished}},x,}}}"
set -g @n_working_sess  "#{n:#{S:#{?#{&&:#{E:@is_hidden_sess},#{==:#{@agent},working}},x,}}}"

set -g @n_hidden_win   "#{n:#{W:#{?#{E:@is_hidden_win},x,}}}"
set -g @n_blocked_win  "#{n:#{W:#{?#{&&:#{E:@is_hidden_win},#{==:#{@agent_win},blocked}},x,}}}"
set -g @n_error_win    "#{n:#{W:#{?#{&&:#{E:@is_hidden_win},#{==:#{@agent_win},error}},x,}}}"
set -g @n_finished_win "#{n:#{W:#{?#{&&:#{E:@is_hidden_win},#{==:#{@agent_win},finished}},x,}}}"
set -g @n_working_win  "#{n:#{W:#{?#{&&:#{E:@is_hidden_win},#{==:#{@agent_win},working}},x,}}}"

# The summary style, re-emitted after every coloured glyph so the counts stay
# dim. Its own option because it holds commas.
set -g @sum_style "#[fg=#{E:@bar_dim},bg=#{E:@pill_bg},nobold]"

set -g @sum_blocked  "#[fg=#{E:@glyph_blocked_fg},bold]#{E:@glyph_blocked_ch}"
set -g @sum_error    "#[fg=#{E:@glyph_error_fg},bold]#{E:@glyph_error_ch}"
set -g @sum_finished "#[fg=#{E:@glyph_finished_fg},bold]#{E:@glyph_finished_ch}"
set -g @sum_working  "#[fg=#{E:@glyph_working_fg},bold]#{E:@glyph_working_ch}"

# IDLE IS DELIBERATELY ABSENT from the summary, so the state counts do not add
# up to the hidden count. "⊞3 ✔1" means three hidden and one of them finished;
# the other two are idle and not worth naming. A count only appears above zero,
# which is also what keeps a collapsed pill with nothing hidden from showing +0.
# THE LEADING SPACE BELONGS AFTER @sum_style, not before it. @sep_out leaves
# bg=teal in effect, and a space placed ahead of the style directive takes that
# background — a stray teal square sat between the chip's closing edge and the
# summary. The same trap already caught @pill_close.
#
# EVERY GLYPH IS FOLLOWED BY A SPACE, and the space is load-bearing rather than
# cosmetic. Ghostty renders a nerd-font glyph across two cells when the next
# cell is blank, and shrinks it to one cell when the next cell is occupied.
# These icons measure 923 units of ink against a 600-unit cell, so packing a
# digit against one dropped it to roughly two thirds the size of the same glyph
# everywhere else in the bar. Nothing else in the bar hit this, because every
# other marker already had a space after it.
set -g @sess_summary "\
#{?#{e|>:#{E:@n_hidden_sess},0},\
#[range=user|exp-s]#{E:@sum_style} #{E:@glyph_expand_ch} #{E:@n_hidden_sess}\
#{?#{e|>:#{E:@n_blocked_sess},0}, #{E:@sum_blocked} #{E:@sum_style}#{E:@n_blocked_sess},}\
#{?#{e|>:#{E:@n_error_sess},0}, #{E:@sum_error} #{E:@sum_style}#{E:@n_error_sess},}\
#{?#{e|>:#{E:@n_finished_sess},0}, #{E:@sum_finished} #{E:@sum_style}#{E:@n_finished_sess},}\
#{?#{e|>:#{E:@n_working_sess},0}, #{E:@sum_working} #{E:@sum_style}#{E:@n_working_sess},}\
#[norange],}"

set -g @win_summary "\
#{?#{e|>:#{E:@n_hidden_win},0},\
#[range=user|exp-w]#{E:@sum_style}#{E:@glyph_expand_ch} #{E:@n_hidden_win}\
#{?#{e|>:#{E:@n_blocked_win},0}, #{E:@sum_blocked} #{E:@sum_style}#{E:@n_blocked_win},}\
#{?#{e|>:#{E:@n_error_win},0}, #{E:@sum_error} #{E:@sum_style}#{E:@n_error_win},}\
#{?#{e|>:#{E:@n_finished_win},0}, #{E:@sum_finished} #{E:@sum_style}#{E:@n_finished_win},}\
#{?#{e|>:#{E:@n_working_win},0}, #{E:@sum_working} #{E:@sum_style}#{E:@n_working_win},}\
#[norange],}"

# The collapsed forms keep the current entry and nothing else. The chip needs no
# opening edge, because nothing sits to its left, and its closing edge doubles
# as the boundary before the summary.
set -g @comp_sessions_collapsed "\
#{S:#{?#{==:#{session_name},#{client_session}},\
#[range=session|#{session_id}]#{E:@style_sel} #{E:@sess_mark}#{s|^[^/]*/||:#{session_name}} #[norange]#{E:@sep_out},}}\
#{E:@sess_summary}"

set -g @comp_windows_collapsed "\
#{W:#{?#{==:#{window_active},1},\
#[range=window|#{window_index}]#{E:@style_win_sel}#{E:@win_mark}#{window_name}#{E:@pane_extra}#[norange] #{E:@sep_unsel} ,}}\
#{E:@win_summary}"

# --- the automatic rule --------------------------------------------------
#
# tmux gives no signal when the bar overflows. It silently truncates the CENTRE
# zone, which is the window list, so the failure is invisible to the config and
# obvious to the eye. The rule therefore has to predict the overflow rather than
# react to it.
#
# #{w:} measures DISPLAY width and ignores style directives, where #{n:} counts
# raw characters. On the real components that is 50 against 589. So the whole
# test is arithmetic over three measurements, evaluated on every redraw with no
# fork and no status-interval lag.
#
# The widths are of the EXPANDED components on purpose. The question is "would
# the expanded bar fit", and answering it from the collapsed widths would make
# the rule oscillate: collapse frees room, the room says expand, expanding
# overflows again.
#
# CHROME is what the three pills cost beyond their contents, measured:
#
#   left pill    @pill_open_flush 1 + @pill_close 2       = 3
#   window pill  @pill_open 2      + @pill_close 2        = 4
#   modeline     @pill_open 2      + @pill_close_flush 0  = 2
#   two gaps between the three pills, 2 columns each      = 4
#                                                          --
#                                                          13
set -g @bar_chrome "13"

# Both candidate widths for each side, so the rule can ask "does the next step
# down fit" rather than only "does this fit".
set -g @w_fixed "#{e|+|:#{w:#{E:@comp_right}},#{E:@bar_chrome}}"

set -g @w_expanded "\
#{e|+|:#{w:#{E:@comp_sessions}},\
#{e|+|:#{w:#{E:@comp_windows}},#{E:@w_fixed}}}"

set -g @w_sess_collapsed "\
#{e|+|:#{w:#{E:@comp_sessions_collapsed}},\
#{e|+|:#{w:#{E:@comp_windows}},#{E:@w_fixed}}}"

# Three steps, in order of how much they take away. `both` exists only here: the
# keyboard cycle never produces it, because a reader has no reason to ask for it
# deliberately. It is the answer when collapsing the sessions alone still
# overflows, which happens around 120 columns with several windows open — and
# leaving it out meant tmux truncated the CENTRE zone and ate the window pill's
# two caps.
#
# Collapse only when it would actually free something. With nothing hidden the
# collapsed form is the expanded form plus a marker, so collapsing there costs
# width instead of saving it.
set -g @collapse_auto "\
#{?#{e|>:#{E:@n_hidden_sess},0},\
#{?#{e|<=:#{E:@w_expanded},#{client_width}},,\
#{?#{e|<=:#{E:@w_sess_collapsed},#{client_width}},sessions,both}},}"

# The manual pin wins whenever it is set. It is session-scoped, so it does not
# follow you to another session, which is what makes a collapse spent on the
# click that used it. prefix + m clears it.
set -g @collapse_eff "#{?#{@collapse},#{@collapse},#{E:@collapse_auto}}"

set -g @comp_sessions_sel "\
#{?#{||:#{==:#{E:@collapse_eff},sessions},#{==:#{E:@collapse_eff},both}},\
#{E:@comp_sessions_collapsed},#{E:@comp_sessions}}"

set -g @comp_windows_sel "\
#{?#{||:#{==:#{E:@collapse_eff},windows},#{==:#{E:@collapse_eff},both}},\
#{E:@comp_windows_collapsed},#{E:@comp_windows}}"

# Right-hand side: shortened path + the 5h allowance with a live countdown.
# One #() call rather than several formats, so the status bar forks once per
# status-interval instead of three times. The countdown is computed there and
# not in statusline.sh so it keeps ticking while Claude Code sits idle.
# The path MUST be quoted: #() runs through `sh -c`, so "Digital Garden"
# arrives as two arguments and the modeline showed "~/Pr/P/Digital".
# EVERY HEX ARGUMENT MUST BE QUOTED. #() runs through `sh -c`, where a bare
# #ccd0da opens a comment and silently swallows the rest of the command line —
# the modeline then ran with no colours and fell back to a plain path. This is
# the same shell that split "Digital Garden" into two arguments.
set -g @comp_right "#(~/.config/tmux/bin/modeline.sh '#{pane_current_path}' #{client_width} '#{E:@pill_bg}' '#{E:@bar_orange}' '#{E:@bar_canvas}')"

# ---------------------------------------------------------------------------
# Workspace indicator, at the far right after the allowance.
#
# Which workspace, and whether the prefix is armed, in one glyph. The context
# comes from the client's own session name rather than a stored option, so two
# ghostty windows on different contexts each show their own.
#
# COLOURS STAY ANSI. colour4 and colour2 ARE catppuccin blue and green in both
# flavours — latte #1e66f5 / #40a02b, mocha #89b4fa / #a6e3a1 — so this tracks
# the terminal for free and needs nothing from theme-sync.
#
# The trailing space after the glyph is load-bearing. Ghostty renders a nerd
# font glyph across two cells when the next cell is blank and shrinks it to one
# when that cell is occupied, and these icons carry 923 units of ink against a
# 600-unit cell. Without the space it arrives two thirds the size of every other
# marker on the bar.
#
# THE COLOUR IS THE FILL, not the glyph, so the indicator reads as a segment
# like the allowance beside it rather than as a coloured character. Canvas text
# on it measures 4.34 on blue and 2.96 on green in latte, 7.79 and 8.46 in mocha.
#
# The separator is the UPPER-LEFT triangle with the ORANGE in the ink. Both
# triangles draw the same picture and only the ink overshoots the cell, so the
# choice is which colour fringes onto the canvas: orange at 1.93, or the
# indicator's own blue at 4.34. Orange is the quieter mistake.
#
# The pill now ends on this colour, so it is what ghostty extends into the right
# padding — the blue or green runs to the window edge exactly as the orange did.
set -g @ctx_glyph "\
#{?#{m:work/*,#{client_session}},#{E:@glyph_work_ch},#{E:@glyph_personal_ch}}"

set -g @ctx_bg "#{?client_prefix,colour2,colour4}"

set -g @comp_ctx "\
#[fg=#{E:@bar_orange},bg=#{E:@ctx_bg},nobold]#{E:@sep_solid_ul}\
#[fg=#{E:@bar_canvas},bg=#{E:@ctx_bg},bold] #{E:@ctx_glyph} "

# ---------------------------------------------------------------------------
# Tier assembly, driven by client-resized (see tmux.conf)
# ---------------------------------------------------------------------------
set -g status-position top
set -g status-left-length 100
set -g status-right-length 60
set -g status-justify left
set -g window-status-separator ""
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g mode-style "bg=colour4,fg=colour0"

# ---------------------------------------------------------------------------
# Copy mode's own chrome
#
# The position indicator sits in the top right of a scrolled pane. It keeps the
# stock #{t/p:top_line_time}, the timestamp of the topmost visible line, which
# answers "when was I looking at" while scrolling back through a long log. The
# `/p` variant prints a shorter, less precise form for times in the past; swap
# it for `#{t/f/%%H#:%%M:top_line_time}` to pin an exact clock format, where the
# doubled %% survives strftime and the escaped #: survives the format parser.
#
# The separator before the position is conditional, because top_line_time is 0
# for lines tmux never timestamped. Emitting it unconditionally would leave a
# dangling middot on most lines.
#
# copy-mode-position-style defaults to #{E:mode-style}, which is why the
# indicator arrived in the same blue as a selection. It takes a format, so it
# can borrow the bar's pill colours and stop competing with the text behind it.
#
# The three match styles are tmux defaults — literally cyan, magenta and red on
# black — and they ignore the theme entirely. ANSI keeps them tracking latte and
# mocha like everything else in the bar.
set -g copy-mode-position-style "bg=#{E:@pill_bg},fg=#{E:@bar_text}"
set -g copy-mode-position-format "\
#[align=right] #{t/p:top_line_time}#{?#{e|>:#{top_line_time},0}, · ,}\
#{scroll_position}/#{history_size}\
#{?search_count, · #{search_count}#{?search_count_partial,+,} matches,}\
#{?search_timed_out, · timed out,} "

set -g copy-mode-match-style         "bg=colour3,fg=colour0"
set -g copy-mode-current-match-style "bg=colour6,fg=colour0"
set -g copy-mode-mark-style          "bg=colour5,fg=colour0"

# status-style and message-style are NOT set here — bin/theme-sync.sh owns them,
# because they need a real surface colour and tmux parses them directly, so they
# cannot reference @pill_bg through a format. These are only the values that
# hold for the instant between this file loading and the first hook firing.
set -g status-style "bg=default,fg=colour8"
set -g message-style "bg=default,fg=colour4"

# ---------------------------------------------------------------------------
# Pills
#
# Three filled groups — sessions, windows, modeline — floating on a transparent
# bar. The empty canvas between them is the separator; nothing is drawn there.
#
# The outer two are FLUSH: no cap on the screen-facing side, so their first and
# last cells carry the pill background and ghostty's `window-padding-color =
# extend` (see ../ghostty/config) samples that and paints the side padding to
# match. The pill reaches the window edge instead of stopping 2pt short. Only
# the middle pill is capped on both sides and actually floats.
#
# CAP GLYPHS are Nerd Font (U+E0B4/U+E0B6). Ghostty bundles symbol fallback and
# JetBrainsMono Nerd Font is installed, so they render here — but rootshell on
# the phone has its own font and may show tofu. Swap both to the half blocks
# ▐ and ▌ for a squared cap that renders in any font at all.
#
# push-default is load-bearing: the session and window entries each end with
# #[default] to drop the styling from a name, and without a pushed default that
# resets the background to the bar's (transparent) one, punching a canvas hole
# after every entry. Pushing the pill's own colours makes #[default] mean "back
# to the pill". Only ONE default can be pushed at a time, which is fine — the
# pills never nest.
# ---------------------------------------------------------------------------
set -g @pill_cap_l ""
set -g @pill_cap_r ""

set -g @pill_open  "#[fg=#{E:@pill_bg},bg=default]#{E:@pill_cap_l}#[bg=#{E:@pill_bg},fg=#{E:@bar_dim}]#[push-default] "
# #[default] BEFORE the padding space, not after. The space closes the pill and
# has to sit on the pill's own background, but a style directive placed after it
# cannot colour it — the space takes whatever style is still in effect. That is
# the pill's colour for an ordinary last entry, so the bug stayed hidden until a
# selected session landed last: the chip leaves bg=teal in effect, and the
# closing space came out teal, reading as a teal block wedged against the cap.
# #[default] resolves to the pushed pill style, so this restores the pill first
# and then pads.
set -g @pill_close "#[default] #[pop-default]#[fg=#{E:@pill_bg},bg=default]#{E:@pill_cap_r}"

# Flush variants: the screen-facing cap is dropped so the edge cell keeps the
# pill background for `extend` to pick up.
set -g @pill_open_flush  "#[bg=#{E:@pill_bg},fg=#{E:@bar_dim}]#[push-default] "

# No leading space. The modeline pill ends in the orange segment, which carries
# its own padding, and a pill-coloured space after it would sit between the
# orange and the screen edge — exactly where `extend` samples for the padding.
# The orange has to own the last cell to bleed into the margin.
set -g @pill_close_flush "#[pop-default]#[bg=default]"

# Default to the widest tier; the resize hook narrows it immediately on attach.
set -g status-left  "#{E:@comp_sessions}"
set -g status-right "#{E:@comp_right} "
set -g window-status-format ""
set -g window-status-current-format ""

# ---------------------------------------------------------------------------
# Session tree (prefix + s, and cmd+s which injects it)
#
# The stock choose-tree is a tree you navigate; this makes it a flat, sorted
# list that carries the same agent markers as the status bar, so one glance
# tells you which session wants you.
#
# -Z zooms the picker to the full window, -s restricts it to sessions (no
# window/pane children), -O name sorts alphabetically instead of by index so
# positions stay stable as sessions come and go.
#
# #{s|#{HOME}|~|:...} substitutes the home directory dynamically — no hardcoded
# path, so this is portable to claw.
# ---------------------------------------------------------------------------
# ONE FORMAT SERVES EVERY ROW, so a bare #{session_name} printed the session
# name on the window rows too — ten identical lines under a session with ten
# windows, which is the opposite of what a picker is for. tmux marks each row
# with session_format, window_format or pane_format, set to 1 for that kind,
# and the format branches on those.
#
# Each branch is a whole option referenced as one #{E:...} unit. The branches
# contain #[fg=...,bold], and a comma inside a #{?...} arm ends the arm — the
# same trap that once rendered the session list in the bar empty.
#
# The window row carries @agent_win, never @agent. A session option inherits
# into every window, so @agent would mark all ten windows with the session's
# rolled-up state.
# NO #{session_name} HERE. choose-tree prints the session name itself, ahead of
# the format, so including it rendered "personal/garden: personal/garden".
# A window row gets an INDEX prefix instead, so #{window_name} below is not a
# repeat of anything.
set -g @tree_sess "\
#{E:@agent_mark}\
#[fg=colour8]#{session_windows}w  #{s|#{HOME}|~|:session_path}#[default]"

set -g @win_glyph_plain "#[fg=#{E:@agent_win_fg},bold]#{E:@agent_win_ch}"
set -g @tree_win_mark "#{?#{@agent_win},#{E:@win_glyph_plain} ,}"

set -g @tree_win "\
#{E:@tree_win_mark}\
#{?window_active,#[fg=colour4#,bold],#[fg=colour7]}\
#{window_name}\
#{?#{e|>:#{window_panes},1},#[fg=colour8]  #{window_panes} panes,}#[default]"

set -g @tree_pane "#[fg=colour8]#{pane_current_command}#[default]"

set -g @tree_format "\
#{?session_format,#{E:@tree_sess},#{?window_format,#{E:@tree_win},#{E:@tree_pane}}}"

bind s run-shell -b "~/.config/tmux/bin/session-tree.sh"

# ---------------------------------------------------------------------------
# New session from tmux's own command prompt — the ':' equivalent.
#
# The prompt is pre-filled with the current context and a slash, so creating
# work/api is: prefix N, type "api", Enter. -I takes a format, which is how the
# context gets in there.
#
# run-shell uses /bin/sh and cannot call a fish function, hence the script.
# ---------------------------------------------------------------------------
bind n command-prompt -p "new session:" -I "#{s|/.*||:#{client_session}}/" { run-shell "~/.config/tmux/bin/session-new.sh '%%'" }

# ---------------------------------------------------------------------------
# Mouse: click a session name to switch to it, click a maximize marker to swap
# which pill is collapsed.
#
# #[range=session|#{session_id}] marks each name as a clickable region, and
# tmux's stock root binding handles those on its own:
#     MouseDown1Status -> switch-client -t =
# where '=' resolves to the clicked range's target.
#
# THE STOCK BINDING HAS TO BE REPLACED, not extended. #[range=user|X] fires the
# same MouseDown1Status key, and `switch-client -t =` on a user range has no
# target to resolve, so the maximize marker would have broken every session
# click. The replacement dispatches on #{mouse_status_range}, which holds the
# literal 'session' for a session range and the argument X for a user one.
#
# Clicking a marker EXPANDS ITS OWN PILL and collapses the other, which is why
# exp-s sets `windows` rather than clearing the option.
# ---------------------------------------------------------------------------
bind -T root MouseDown1Status {
    if -F "#{==:#{mouse_status_range},exp-s}" {
        set @collapse windows
    } {
        if -F "#{==:#{mouse_status_range},exp-w}" {
            set @collapse sessions
        } {
            switch-client -t =
        }
    }
}

# prefix + m cycles all three states, so the keyboard can reach the default
# again. A marker only exists while something is collapsed, so the mouse alone
# cannot return to both-expanded.
bind m run-shell -b "~/.config/tmux/bin/collapse-cycle.sh"

# ---------------------------------------------------------------------------
# Agent attention: raising is Claude's job, clearing is partly yours.
#
# pane-focus-in starts a dwell timer. After 5s of GENUINE attention — this pane
# active, in the active window, of an attached session, AND the terminal itself
# holding OS focus — a `finished` or `error` marker clears itself.
#
# `blocked` is deliberately exempt. Looking at a blocked agent does not unblock
# it, so clearing on attention would be a lie; only the agent can end that
# condition. Paseo, cmux and marmonitor all reach the same conclusion by three
# different mechanisms.
#
# @client_focused tracks whether the terminal has OS focus, because
# pane-focus-in alone stays true while you read email in a browser.
# ---------------------------------------------------------------------------
set -g @client_focused 1
set-hook -g client-focus-in  'set -g @client_focused 1'
set-hook -g client-focus-out 'set -g @client_focused 0'

set-hook -g pane-focus-in 'run-shell -b "~/.config/tmux/bin/agent-ack.sh #{pane_id}"'

# A pane that dies while blocked would otherwise hold its marker forever, since
# nothing re-aggregates when the process simply goes away. Aliveness is an axis
# of its own.
set-hook -g pane-exited 'run-shell -b "~/.claude/bin/tmux-agent-rollup.sh"'
set-hook -g pane-died   'run-shell -b "~/.claude/bin/tmux-agent-rollup.sh"'
