# tmux — Diego Vicente
#
# Ghostty is a dumb display surface. tmux owns sessions, windows, panes and all
# navigation between them. See ghostty/config for the matching unbinds.
#
# Attached to from two places:
#   - Ghostty on this Mac (plain tmux, two pinned windows: work + personal)
#   - rootshell on iOS (tmux -CC control mode -> native tabs/splits)
#
# NOTE ON VARIABLES: tmux expands #{@user-option} only in COMMAND ARGUMENTS that
# take a format, never in a target (-t) and never in the value of a built-in
# option. Both were tried and both fail at runtime, so the workspace names live
# in bin/tmux-workspace.sh (real shell variables) and are literals here.

# ---------------------------------------------------------------------------
# Prefix — C-Space. Free in fish, in nvim and in the Claude Code prompt box,
# unlike C-a (beginning-of-line) and C-b (backward-char).
# ---------------------------------------------------------------------------
# PRIMARY: cmd+; on the Mac.
#
# macOS never transmits Cmd to the terminal, so `cmd+;` cannot be a tmux
# binding. Ghostty catches the chord and writes 0x1c into the pty, which tmux
# reads as C-\. Nothing else uses C-\: fish leaves it unbound, and its usual
# tty meaning (SIGQUIT) never fires because tmux runs the tty in raw mode.
set -g prefix 'C-\'

# SECONDARY: the phone.
#
# rootshell's on-screen keys are a fixed set and its keybind config is not
# reachable on iPhone, so the prefix has to be something the toolbar can
# already type: tap Ctrl, tap b. 'b' is 0x62, and 0x62 & 0x1F = 0x02.
#
# Explicitly NOT C-Space: that is NUL (0x00), which iOS swallows as the system
# input-language switcher and which is the one byte with known delivery
# flakiness inside a `text:` action.
#
# Bonus: C-b is tmux's stock prefix, so every doc applies unmodified. The cost
# is losing C-b (backward-char) in fish everywhere — that is arrow-left.
set -g prefix2 'C-b'
bind C-b send-prefix

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
# tmux advertises its own capabilities INWARD (tmux-256color) and re-adds
# Ghostty's extras OUTWARD. terminal-overrides matches the OUTER terminal's
# TERM, which Ghostty sets to xterm-ghostty — a "*256col*" pattern never
# matches it, which silently costs you truecolor. Do not use screen-256color.
set  -g  default-terminal "tmux-256color"

# Applied once per server, not once per reload. `set -ga` APPENDS, so without
# this guard every `prefix + r` stacked another copy — the live server had each
# override listed four times.
%if "#{!=:#{@term_caps_applied},1}"
    set -ga terminal-overrides ",xterm-ghostty:RGB"
    set -ga terminal-overrides ",xterm-ghostty:Smulx=\\E[4::%p1%dm"
    set -ga terminal-overrides ",*256col*:Tc"
    # Nested case: an outer tmux hands the inner TERM=tmux-256color, whose
    # terminfo does not declare RGB, so truecolor would silently degrade.
    set -ga terminal-overrides ",tmux-256color:RGB"
    set -ga terminal-features ",*:usstyle"
    set -ga terminal-features ",*:sync"   # DEC 2026 — stops Claude Code flicker
    set -g  @term_caps_applied 1
%endif

# NOTE: terminal-overrides are negotiated at client ATTACH time. After editing
# them, `prefix + r` is not enough — detach and reattach, or restart Ghostty.

set  -sg escape-time 10          # ms; the 500 default makes Esc feel broken in nvim
set  -g  focus-events on
set  -g  history-limit 100000    # tmux IS the scrollback under control mode
set  -g  set-clipboard on        # OSC 52; Ghostty and rootshell both honour it

# ---------------------------------------------------------------------------
# Coding agents — none of these are optional when Claude Code lives in a pane
# ---------------------------------------------------------------------------
set  -g  allow-passthrough on    # let Claude's OSC notification sequences through
set  -s  extended-keys on        # without this Shift+Enter == Enter, breaking
set  -as terminal-features 'xterm*:extkeys'   #   multi-line prompts inside tmux
bind o send-keys C-o             # Claude uses C-o for transcript expansion

set  -g  monitor-bell on         # Claude rings the bell on stop / permission ask
set  -g  bell-action any

# ---------------------------------------------------------------------------
# Survival — the rootshell lesson
#
# Grouped sessions SHARE windows. Closing a native tab in control mode sends
# kill-window, which deletes that window on the Mac too; if it was the last one
# the session dies and exit-empty takes the whole server with it.
#
# exit-empty off      -> the server outlives its last session
# destroy-unattached  -> a session with no clients stays alive (already default)
# detach-on-destroy   -> stays ON deliberately: with OFF, closing the last window
#                        of `work` would silently hop that Ghostty window to
#                        `personal` instead of closing. Wrong for pinned windows.
# ---------------------------------------------------------------------------
set -g exit-empty off
set -g destroy-unattached off
set -g detach-on-destroy on

# ---------------------------------------------------------------------------
# Mouse, indexing, titles
# ---------------------------------------------------------------------------
set  -g  mouse on

# COPY MODE SCROLLS, IT NEVER SELECTS. tmux's stock bindings make a drag on a
# pane enter copy mode and open a selection, and only MouseDragEnd1Pane closes
# it again:
#
#   root          MouseDrag1Pane     -> copy-mode -M
#   copy-mode-vi  MouseDrag1Pane     -> send -X begin-selection
#   copy-mode-vi  MouseDragEnd1Pane  -> copy-pipe-and-cancel
#
# Lose the button release — drag past the window edge, or let trackpad momentum
# carry past it — and that last line never runs. The selection stays open, every
# wheel event extends it, and the pane fills with mode-style blue and scrolls
# away on its own. There is no keystroke that obviously ends it, because the
# state is a half-finished drag rather than a mode.
#
# Removing the three drag bindings leaves copy mode as a pure pager: the wheel
# scrolls, `q` exits, and nothing can begin a selection by accident. The root
# binding keeps its pass-through arm, so neovim and Claude Code still receive
# drags they asked for.
#
# Selecting text still works two ways. Inside tmux, `v` starts a selection and
# `y` copies it. Outside tmux, hold Shift while dragging and ghostty does the
# selection itself, bypassing mouse reporting entirely.
bind -T root MouseDrag1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M"
unbind -T copy-mode-vi MouseDrag1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  renumber-windows on
setw -g  aggressive-resize on   # the phone must not squeeze the Mac client

set  -g  set-titles on
set  -g  set-titles-string "#{session_name} · #W"

# ---------------------------------------------------------------------------
# Window names
#
# tmux's default automatic-rename-format is #{pane_current_command}, which for
# Claude Code is its VERSION STRING — windows were called "2.1.226". Meanwhile
# Claude sets pane_title to the conversation name ("tmux configuration"), which
# is exactly what you want to read.
#
# So: prefer pane_title, fall back to the command when there is no title.
#
# The leading "⠐ " is one frame of an animated braille spinner and changes
# constantly; stripping it keeps the window name stable instead of flickering.
# [:alnum:] cannot be used here — the colon collides with tmux's own format
# delimiter — hence the explicit a-zA-Z0-9 range.
#
# Truncated to 24 columns so a long conversation name cannot swamp the bar.
# ---------------------------------------------------------------------------
set -g automatic-rename on

# The directory name, nothing more.
#
# NOT a path relative to the session root, which is what you actually want:
# automatic-rename-format is evaluated with NO SESSION BOUND, so #{session_path}
# and any session-scoped user option both come back EMPTY there. The pattern
# collapsed to "^/" and produced names like
# "Users/dvicente/Projects/Personal/trellis". Proven by setting the format to a
# diagnostic and reading it back:
#
#   inside the rename:   root=[] sp=[] b=[trellis]
#   via display-message: root=[/Users/.../Personal] sp=[...] b=[trellis]
#
# Only pane- and window-scoped formats resolve here. Getting "a/b/c" would need
# naming driven from a hook (pane-focus-in / after-select-window), which do run
# with a session bound. The modeline already carries the full path anyway.
set -g @win_relpath "#{b:pane_current_path}"

# pane_title with the animated spinner frame stripped.
set -g @win_title "#{s|^[^a-zA-Z0-9~/]* ||:#{pane_title}}"

# A title that starts with ~ or / is a path — that is fish reporting its cwd,
# which the relative form says better. Anything else is a real title, which for
# Claude Code is the conversation name.
set -g @win_title_is_path "#{||:#{m:~*,#{E:@win_title}},#{m:/*,#{E:@win_title}}}"

set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{||:#{==:#{E:@win_title},},#{E:@win_title_is_path}},#{E:@win_relpath},#{=/24:#{E:@win_title}}}}#{?pane_dead,[dead],}"

# ---------------------------------------------------------------------------
# Panes — replaces Ghostty's cmd+d, cmd+shift+d, cmd+hjkl, cmd+shift+enter
# ---------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind z resize-pane -Z
bind x kill-pane
bind Space next-layout

# ---------------------------------------------------------------------------
# Windows — replaces Ghostty's cmd+t and cmd+1..9.
# Alt+N is the main motion; needs macos-option-as-alt in ghostty/config.
# ---------------------------------------------------------------------------
# `t` for tab — these are tabs in every way that matters, and it inherits the
# cmd+t muscle memory that Ghostty gave up. It replaces clock-mode, which draws
# an ASCII clock and is of no use to anyone. `c` (tmux's own default, "create")
# stays bound so copy-pasted advice from the internet still works.
bind t new-window -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
# prefix + n is the session creator now (see status.conf), so window motion
# moves to [ and ] — which is also what cmd+shift+h / cmd+shift+l inject.
bind -r [ previous-window
bind -r ] next-window
bind -r p previous-window
bind Tab last-window

# ---------------------------------------------------------------------------
# Sessions
#
# Deliberately understated: with two pinned workspaces you do NOT want a quick
# switch key, or the "work" window ends up showing "personal". choose-tree is
# the escape hatch; double-tap prefix toggles back if you took it.
# ---------------------------------------------------------------------------
bind 'C-\' switch-client -l    # double-tap cmd+; -> last session
bind s choose-tree -Zs

# ---------------------------------------------------------------------------
# Copy mode — vi keys, phone-friendly exit
# ---------------------------------------------------------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi q send -X cancel

# ---------------------------------------------------------------------------
# Reload
# ---------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"


# Menus borrow the bar's colours, so choose-tree and the stock mouse menus read
# as part of the same surface rather than as tmux's own green. All four take
# formats, so they follow the flavour like everything else theme-sync publishes.
set -g menu-style          "bg=#{E:@pill_bg},fg=#{E:@bar_text}"
set -g menu-selected-style "bg=#{E:@bar_teal},fg=#{E:@bar_canvas},bold"
set -g menu-border-style   "fg=#{E:@pill_bg},bg=default"
set -g menu-border-lines   rounded

# ---------------------------------------------------------------------------
# Status bar + agent state — see status.conf. Split out because it is the
# noisiest part of this config and the part most likely to churn.
# ---------------------------------------------------------------------------
source-file ~/.config/tmux/status.conf

# ---------------------------------------------------------------------------
# Responsive: layout AND status bar react to the client width.
#
# Two traps, both of which fail SILENTLY:
#   - #{<:...} is a STRING compare, so "80" > "120". Use #{e|<:...}.
#   - window_width lags one resize behind; client_width is current.
# ---------------------------------------------------------------------------
set -g @width_narrow 120

set-hook -g client-resized 'run-shell "~/.config/tmux/bin/status-tier.sh"'

# theme-sync execs status-tier, so attaching gets both the flavour and the tier.
# A resize cannot change the flavour, so that path stays on the cheaper script.
set-hook -g client-attached 'run-shell "~/.config/tmux/bin/theme-sync.sh"'

# Skip the automatic relayout while tmux-margin owns this window. Without the
# guard the two fight on every resize: this hook flattens the layout and the
# plugin rebuilds the margins, which shows as a flicker.
set-hook -ga client-resized 'if -F "#{@margin-enabled}" "" "if -F \"#{e|<:#{client_width},120}\" \"select-layout even-vertical\" \"select-layout even-horizontal\""'

# Catch a light/dark switch that happened while the terminal was in the
# background. There is no hook for "the terminal changed theme" — ghostty swaps
# its palette without telling tmux — so coming back to the window is the moment
# we get to notice. theme-sync no-ops when the flavour has not moved.
set-hook -ga client-focus-in 'run-shell -b "~/.config/tmux/bin/theme-sync.sh"'

# Once at load, so a server started without a client still has sane colours.
run-shell "~/.config/tmux/bin/theme-sync.sh"

# Each session needs to know its neighbours, so every boundary in the bar draws
# exactly one separator. #{S:} cannot see its own previous iteration, so the
# fact has to arrive from outside. Only a change to the session LIST can move a
# neighbour — switching session cannot — so there is deliberately no
# client-session-changed hook here. See bin/session-seps.sh.
set-hook -g session-created  'run-shell -b "~/.config/tmux/bin/session-seps.sh"'
set-hook -g session-closed   'run-shell -b "~/.config/tmux/bin/session-seps.sh"'
set-hook -g session-renamed  'run-shell -b "~/.config/tmux/bin/session-seps.sh"'
set-hook -ga client-attached 'run-shell -b "~/.config/tmux/bin/session-seps.sh"'
run-shell -b "~/.config/tmux/bin/session-seps.sh"

# ---------------------------------------------------------------------------
# Plugins — keep this list short on purpose. prefix + I to install.
# See README.md in this directory for the "reach for these when pain arises"
# list and which pain each one actually solves.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Surviving a reboot
#
# A tmux server is an ordinary process. Shutting the Mac down kills it, and
# sessions exist only in that process's memory. exit-empty and destroy-unattached
# above protect against closing a WINDOW, never against the machine stopping.
#
# resurrect saves the tree — sessions, windows, names, layouts and each pane's
# cwd. continuum re-saves periodically and restores when the server starts.
# Neither has been touched since August 2024. They are short shell scripts
# against a stable API and they still work, but nobody is fixing a regression
# for you.
#
# CLAUDE IS DELIBERATELY ABSENT FROM @resurrect-processes. Restoring it that way
# would relaunch a FRESH agent with no conversation, which is worse than an
# empty shell because it looks restored. The conversation is replayed instead by
# the two hooks below, which carry the session id across the reboot.
#
# CONTINUUM'S AUTOSAVE NEEDS HELP HERE. It installs its save trigger as a #() in
# `status-right`, and this config sets status-format[0], which replaces the
# default assembly — so status-right is never expanded. bin/status-tier.sh puts
# the trigger into status-format[0] instead, where it does get evaluated.
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# A resurrect hook is SHELL, not a tmux command. helpers.sh runs it with
# `eval "$hook $args"` from inside the save script, so a `run-shell ...` value
# would eval to a command that does not exist — silently, since the hook's exit
# status is discarded. Only the test caught it.
set -g @resurrect-hook-post-save-all    '$HOME/.config/tmux/bin/claude-map-save.sh'
set -g @resurrect-hook-post-restore-all '$HOME/.config/tmux/bin/claude-map-restore.sh'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ---------------------------------------------------------------------------
# tmux-margin — caps each pane at a readable width and fills the rest with
# blank margins. Local plugin, so it loads with run-shell rather than TPM.
# Options must be set before the run-shell, because the plugin reads them once.
# ---------------------------------------------------------------------------
set -g @margin-width 140

# prefix c is new-window and prefix C is customize-mode, so the toggle takes
# prefix C-c. prefix r reloads this file, so recompute takes prefix M-c.
set -g @margin-key 'C-c'
set -g @margin-recompute-key 'M-c'

# The splits keep the keys already used here, and the plugin adds the margin
# rebuild to each one.
set -g @margin-split-h-key '|'
set -g @margin-split-v-key '-'

# The killswitch. C-M-m needs no prefix, which is the point: it must work when a
# pane stops responding. prefix M is the same thing through the prefix.
set -g @margin-panic-key 'C-M-m'
set -g @margin-kill-key 'M'

run-shell "~/Projects/Personal/tmux-margin/margin.tmux"

# TPM HAS NEVER LOADED A PLUGIN IN THIS CONFIG. It derives the plugin directory
# from where it finds the config: seeing ~/.config/tmux/tmux.conf, it looks for
# plugins in ~/.config/tmux/plugins/ — a directory that does not exist, and one
# that would live INSIDE the dotfiles repo if it did, since ~/.config/tmux is a
# symlink to tmux/ here. That is why tmux-sensible and vim-tmux-navigator have
# been declared for months without ever being installed.
#
# The override is tpm's own documented escape hatch, and it has to be set before
# tpm runs.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
run '~/.tmux/plugins/tpm/tpm'   # must stay last
