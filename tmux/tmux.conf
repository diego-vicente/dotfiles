# tmux — Diego Vicente
#
# Ghostty is a dumb display surface. tmux owns sessions, windows, panes and all
# navigation between them. See ghostty/config for the matching unbinds.
#
# Attached to from two places:
#   - Ghostty on this Mac (plain tmux, two pinned windows: work + personal)
#   - rootshell on iOS (tmux -CC control mode -> native tabs/splits)
#
# NOTE ON VARIABLES: tmux expands #{@user-option} only in COMMAND ARGUMENTS that
# take a format, never in a target (-t) and never in the value of a built-in
# option. Both were tried and both fail at runtime, so the workspace names live
# in bin/tmux-workspace.sh (real shell variables) and are literals here.

# ---------------------------------------------------------------------------
# Prefix — C-Space. Free in fish, in nvim and in the Claude Code prompt box,
# unlike C-a (beginning-of-line) and C-b (backward-char).
# ---------------------------------------------------------------------------
# PRIMARY: cmd+; on the Mac.
#
# macOS never transmits Cmd to the terminal, so `cmd+;` cannot be a tmux
# binding. Ghostty catches the chord and writes 0x1c into the pty, which tmux
# reads as C-\. Nothing else uses C-\: fish leaves it unbound, and its usual
# tty meaning (SIGQUIT) never fires because tmux runs the tty in raw mode.
set -g prefix 'C-\'

# SECONDARY: the phone.
#
# rootshell's on-screen keys are a fixed set and its keybind config is not
# reachable on iPhone, so the prefix has to be something the toolbar can
# already type: tap Ctrl, tap b. 'b' is 0x62, and 0x62 & 0x1F = 0x02.
#
# Explicitly NOT C-Space: that is NUL (0x00), which iOS swallows as the system
# input-language switcher and which is the one byte with known delivery
# flakiness inside a `text:` action.
#
# Bonus: C-b is tmux's stock prefix, so every doc applies unmodified. The cost
# is losing C-b (backward-char) in fish everywhere — that is arrow-left.
set -g prefix2 'C-b'
bind C-b send-prefix

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
# tmux advertises its own capabilities INWARD (tmux-256color) and re-adds
# Ghostty's extras OUTWARD. terminal-overrides matches the OUTER terminal's
# TERM, which Ghostty sets to xterm-ghostty — a "*256col*" pattern never
# matches it, which silently costs you truecolor. Do not use screen-256color.
set  -g  default-terminal "tmux-256color"

# Applied once per server, not once per reload. `set -ga` APPENDS, so without
# this guard every `prefix + r` stacked another copy — the live server had each
# override listed four times.
%if "#{!=:#{@term_caps_applied},1}"
    set -ga terminal-overrides ",xterm-ghostty:RGB"
    set -ga terminal-overrides ",xterm-ghostty:Smulx=\\E[4::%p1%dm"
    set -ga terminal-overrides ",*256col*:Tc"
    # Nested case: an outer tmux hands the inner TERM=tmux-256color, whose
    # terminfo does not declare RGB, so truecolor would silently degrade.
    set -ga terminal-overrides ",tmux-256color:RGB"
    set -ga terminal-features ",*:usstyle"
    set -ga terminal-features ",*:sync"   # DEC 2026 — stops Claude Code flicker
    set -g  @term_caps_applied 1
%endif

# NOTE: terminal-overrides are negotiated at client ATTACH time. After editing
# them, `prefix + r` is not enough — detach and reattach, or restart Ghostty.

set  -sg escape-time 10          # ms; the 500 default makes Esc feel broken in nvim
set  -g  focus-events on
set  -g  history-limit 100000    # tmux IS the scrollback under control mode
set  -g  set-clipboard on        # OSC 52; Ghostty and rootshell both honour it

# ---------------------------------------------------------------------------
# Coding agents — none of these are optional when Claude Code lives in a pane
# ---------------------------------------------------------------------------
set  -g  allow-passthrough on    # let Claude's OSC notification sequences through
set  -s  extended-keys on        # without this Shift+Enter == Enter, breaking
set  -as terminal-features 'xterm*:extkeys'   #   multi-line prompts inside tmux
bind o send-keys C-o             # Claude uses C-o for transcript expansion

set  -g  monitor-bell on         # Claude rings the bell on stop / permission ask
set  -g  bell-action any

# ---------------------------------------------------------------------------
# Survival — the rootshell lesson
#
# Grouped sessions SHARE windows. Closing a native tab in control mode sends
# kill-window, which deletes that window on the Mac too; if it was the last one
# the session dies and exit-empty takes the whole server with it.
#
# exit-empty off      -> the server outlives its last session
# destroy-unattached  -> a session with no clients stays alive (already default)
# detach-on-destroy   -> stays ON deliberately: with OFF, closing the last window
#                        of `work` would silently hop that Ghostty window to
#                        `personal` instead of closing. Wrong for pinned windows.
# ---------------------------------------------------------------------------
set -g exit-empty off
set -g destroy-unattached off
set -g detach-on-destroy on

# ---------------------------------------------------------------------------
# Mouse, indexing, titles
# ---------------------------------------------------------------------------
set  -g  mouse on
set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  renumber-windows on
setw -g  aggressive-resize on   # the phone must not squeeze the Mac client

set  -g  set-titles on
set  -g  set-titles-string "#{session_name} · #W"

# ---------------------------------------------------------------------------
# Panes — replaces Ghostty's cmd+d, cmd+shift+d, cmd+hjkl, cmd+shift+enter
# ---------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind z resize-pane -Z
bind x kill-pane
bind Space next-layout

# ---------------------------------------------------------------------------
# Windows — replaces Ghostty's cmd+t and cmd+1..9.
# Alt+N is the main motion; needs macos-option-as-alt in ghostty/config.
# ---------------------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -r n next-window
bind -r p previous-window
bind Tab last-window

# ---------------------------------------------------------------------------
# Sessions
#
# Deliberately understated: with two pinned workspaces you do NOT want a quick
# switch key, or the "work" window ends up showing "personal". choose-tree is
# the escape hatch; double-tap prefix toggles back if you took it.
# ---------------------------------------------------------------------------
bind 'C-\' switch-client -l    # double-tap cmd+; -> last session
bind s choose-tree -Zs

# ---------------------------------------------------------------------------
# Copy mode — vi keys, phone-friendly exit
# ---------------------------------------------------------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi q send -X cancel

# ---------------------------------------------------------------------------
# Reload
# ---------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ---------------------------------------------------------------------------
# Status bar — minimal. Not drawn at all under control mode, where rootshell
# renders native tabs instead.
#
# COLOURS: ANSI 0-15 and `default` ONLY. Never 256-palette indices (colour238)
# and never hex. Terminals theme 0-15 themselves, so the status bar tracks
# whatever palette the CLIENT has — Ghostty flipping latte<->mocha with the
# system appearance, or rootshell's own day/night on the phone — with no
# appearance-sync handler, no reload, and correctly over SSH, where the server
# cannot possibly know what appearance the client is in.
#
# The previous hardcoded colour238/245/255 were generic greys that never
# matched Catppuccin. That was the "colours look slightly off" symptom; it was
# never a truecolor problem (24-bit passes through tmux byte-identical).
# ---------------------------------------------------------------------------
set -g status-position top
set -g status-style "bg=default,fg=colour8"
set -g status-left  " #[fg=colour4,bold]#S#[default]  "
set -g status-left-length 30
set -g status-right "#{?client_prefix,#[fg=colour3,bold]PREFIX #[default],}#[fg=colour8]%H:%M "
set -g window-status-style "fg=colour8"
set -g window-status-current-style "fg=colour7,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g message-style "bg=default,fg=colour4"
set -g mode-style "bg=colour4,fg=colour0"

# ---------------------------------------------------------------------------
# Plugins — keep this list short on purpose. prefix + I to install.
# See README.md in this directory for the "reach for these when pain arises"
# list and which pain each one actually solves.
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'   # must stay last
